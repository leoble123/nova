name: release
# Shipping = bump `version` in src-tauri/Cargo.toml and push to main.
# When that version has no release yet, this builds and tests Nova and publishes GitHub Release
# v<version> with Nova.exe, the installer and latest.json, which installed copies update from.
# No secrets needed: the workflow's own token publishes to this repository.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Version not released yet?
        id: ver
        shell: bash
        run: |
          v=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "v$v is already released"; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ver.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - if: steps.ver.outputs.skip == 'false'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.ver.outputs.skip == 'false'
        uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - if: steps.ver.outputs.skip == 'false'
        run: npm ci
      - if: steps.ver.outputs.skip == 'false'
        run: cargo test --release
        working-directory: src-tauri
      - if: steps.ver.outputs.skip == 'false'
        run: npx tauri build
      - name: Publish
        if: steps.ver.outputs.skip == 'false'
        shell: bash
        run: |
          v="${{ steps.ver.outputs.version }}"
          mkdir out
          cp src-tauri/target/release/nova.exe out/Nova.exe
          cp src-tauri/target/release/bundle/nsis/*-setup.exe "out/Nova-$v-setup.exe"
          notes=$(git log -1 --format=%s)
          python tools/make_manifest.py out/Nova.exe "$v" "https://github.com/${{ github.repository }}/releases/download/v$v/Nova.exe" "$notes" > out/latest.json
          (cd out && sha256sum Nova.exe "Nova-$v-setup.exe" > SHA256SUMS.txt)
          gh release create "v$v" --title "Nova $v" --notes "$notes" out/*
