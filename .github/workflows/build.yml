name: build
# Every push: type check, Rust tests and a full Windows build. Downloadable builds come from
# release.yml (GitHub Releases), so nothing is uploaded here.
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # The bundled Opus sources (inside lagless) declare an old cmake_minimum_required.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: cargo test --release
        working-directory: src-tauri
      - run: npx tauri build
