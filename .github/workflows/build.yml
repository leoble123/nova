name: build
# Every push: Rust tests + type check, then a Windows build producing the installer and a
# portable exe as artifacts.
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # The bundled Opus sources (inside lagless) declare an old cmake_minimum_required.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: cargo test --release
        working-directory: src-tauri
      - run: npx tauri build
      - shell: bash
        run: |
          mkdir -p dist-win
          cp src-tauri/target/release/nova.exe dist-win/Nova-portable.exe
          cp src-tauri/target/release/bundle/nsis/*.exe dist-win/
          cd dist-win && sha256sum *.exe > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nova-windows
          path: dist-win/*
